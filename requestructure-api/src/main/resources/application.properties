spring.application.name=requestructure-api

# MySQL: fallback a localhost para desarrollo. En produccion (Render) se sobreescriben via variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/requestructure_db?createDatabaseIfNotExist=true&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
# open-in-view=true para permitir lazy loading durante la serializacion JSON
spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del servidor
server.port=${PORT:8080}
