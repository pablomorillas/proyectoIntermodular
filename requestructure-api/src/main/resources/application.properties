spring.application.name=requestructure-api

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/requestructure_db?createDatabaseIfNotExist=true&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USER:requestructure}
spring.datasource.password=${DB_PASSWORD:requestructure}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}
