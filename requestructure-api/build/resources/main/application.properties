spring.application.name=requestructure-api

# MySQL en localhost:3306 (usa root/root o root sin password segun tu instalacion)
spring.datasource.url=jdbc:mysql://localhost:3306/requestructure_db?createDatabaseIfNotExist=true&serverTimezone=Europe/Madrid
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Puerto del servidor
server.port=8080
